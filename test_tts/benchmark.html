<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixed Language Emotion Test</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 800px; margin: 0 auto; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #0066cc; color: white; border: none; border-radius: 4px; }
        button:disabled { background: #ccc; }
        .log-box { background: #f5f5f5; padding: 15px; border-radius: 4px; font-family: monospace; min-height: 200px; margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h1>🇮🇳 The Frankenstein Method (10 Cases)</h1>
    <p>Using the Hindi Voice Engine to read extreme emotions in Devanagari, seamlessly transitioning into normal English!</p>
    
    <button id="start-btn">Run 10 Test Cases</button>
    
    <div id="log-box" class="log-box"></div>

    <script>
        const testSentences = [
            { 
                emotion: "1. Mistake", 
                normal: "Oh no, your back is rounding too much!",
                humanized: "ऊऊह नोओओ! your back is rounding too much!"
            },
            { 
                emotion: "2. Victory", 
                normal: "Wow, that was an incredible lift!",
                humanized: "वाआउउ! that was an incredible lift!!" 
            },
            { 
                emotion: "3. Exhaustion", 
                normal: "Please wait, take a small rest before the next set.",
                humanized: "प्लीज वेएएट! take a small rest before the next set." 
            },
            { 
                emotion: "4. Encouragement", 
                normal: "Lets go, push for one more rep!",
                humanized: "लेएएट्स गोओओ! push for one more rep!" 
            },
            { 
                emotion: "5. Struggle / Pain", 
                normal: "Ahhh, this burns so much, but keep going!",
                humanized: "आआअअह! this burns so much, but keep going!" 
            },
            { 
                emotion: "6. Hype", 
                normal: "Yesssss, you completely crushed that personal record!",
                humanized: "येस्स्स्स्स्स! you completely crushed that personal record!" 
            },
            { 
                emotion: "7. Disappointment", 
                normal: "Aww man, you missed the lockout.",
                humanized: "अउउउ मैैन! you missed the lockout." 
            },
            { 
                emotion: "8. Urgency", 
                normal: "Quick, drop the weight before you hurt yourself!",
                humanized: "क्विइइक! drop the weight before you hurt yourself!" 
            },
            { 
                emotion: "9. Relief", 
                normal: "Phew, that set is finally over.",
                humanized: "फिऊउउ! that set is finally over." 
            },
            { 
                emotion: "10. Surprise", 
                normal: "What, I didn't think you could lift that!",
                humanized: "व्हाआअट! I didn't think you could lift that!" 
            }
        ];

        function logToUI(msg) {
            const box = document.getElementById("log-box");
            box.textContent += msg + "\n";
            box.scrollTop = box.scrollHeight;
        }

        function speak(text, isHindi) {
            return new Promise((resolve) => {
                const utterance = new SpeechSynthesisUtterance(text);
                
                // Find a Hindi voice!
                const voices = window.speechSynthesis.getVoices();
                let voice;
                if (isHindi) {
                    voice = voices.find(v => v.lang.startsWith('hi-IN') || v.name.toLowerCase().includes('hindi'));
                } else {
                    voice = voices.find(v => v.lang.startsWith('en-US'));
                }
                
                if (voice) {
                    utterance.voice = voice;
                }
                
                utterance.pitch = 1.0;
                utterance.rate = 1.0;
                
                utterance.onend = () => setTimeout(resolve, 500); 
                utterance.onerror = resolve; 
                
                window.speechSynthesis.speak(utterance);
            });
        }

        async function runBenchmark() {
            const btn = document.getElementById("start-btn");
            btn.disabled = true;
            document.getElementById("log-box").textContent = "";
            
            // Ensure voices are loaded
            window.speechSynthesis.getVoices();

            for (const sentence of testSentences) {
                logToUI(`\n=== Testing: "${sentence.emotion}" ===`);
                
                // 1. The flat robot version
                logToUI(`🤖 NORMAL TEXT: "${sentence.normal}"`);
                await speak(sentence.normal, false);

                // 2. The Frankenstein version
                logToUI(`🎭 MIXED HINDI/ENGLISH: "${sentence.humanized}"`);
                await speak(sentence.humanized, true);
            }

            logToUI("\nTest Complete!");
            btn.disabled = false;
        }

        document.getElementById("start-btn").addEventListener("click", runBenchmark);
        
        speechSynthesis.onvoiceschanged = () => { speechSynthesis.getVoices(); };
    </script>
</body>
</html>
