<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kokoro Prosodic Hack Test</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 800px; margin: 0 auto; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #0066cc; color: white; border: none; border-radius: 4px; }
        button:disabled { background: #ccc; }
        select { padding: 10px; font-size: 16px; margin-right: 10px; }
        .log-box { background: #f5f5f5; padding: 15px; border-radius: 4px; font-family: monospace; min-height: 200px; margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h1>🧠 Neural Prosody Test (Kokoro AI)</h1>
    <p>Let's test the <strong>New Comma-Based Text</strong> on Kokoro-82M!</p>
    
    <div style="margin: 20px 0;">
        <select id="voice-select">
            <option value="af_heart">American Female (Heart)</option>
            <option value="am_adam">American Male (Adam)</option>
            <option value="bf_emma">British Female (Emma)</option>
            <option value="bm_george">British Male (George)</option>
        </select>
        <button id="start-btn">Run AI Emotion Test</button>
    </div>
    
    <div id="status" style="margin-top: 15px; font-weight: bold; color: #0066cc;">Ready to initialize worker...</div>
    <div id="log-box" class="log-box"></div>

    <script type="module">
        // NEW TEXT (Commmas instead of ellipses, no stuttering)
        const testSentences = [
            { 
                emotion: "Mistake / Accident", 
                normal: "ओह नो, आई ड्रॉप्ड द वेट।",
                humanized: "ऊऊह नोओओ!, उह्ह, वेल आई ड्रॉप्ड द वेट!"
            },
            { 
                emotion: "Extreme Joy", 
                normal: "वाव, वी ऐक्चुअली वन द ग्रैंड प्राइज।",
                humanized: "वाआउउउ! आई कैनॉट बिलीव, वी ऐक्चुअली वन द ग्रैंड प्राइज!!" 
            },
            { 
                emotion: "Exhaustion / Fear", 
                normal: "प्लीज वेट, आई ऐम सो टायर्ड फ्रॉम रनिंग।",
                humanized: "प्लीज, वेएएट!, आई ऐम सोओओ, इन्क्रेडिबली टायर्ड, फ्रॉम रनिंग।" 
            }
        ];

        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Connect to the Kokoro Worker
        const worker = new Worker('kokoroWorker.js', { type: 'module' });

        function logToUI(msg) {
            const box = document.getElementById("log-box");
            box.textContent += msg + "\n";
            box.scrollTop = box.scrollHeight;
        }

        function initModel() {
            return new Promise((resolve, reject) => {
                const status = document.getElementById("status");
                logToUI("Downloading Kokoro-82M Model in background thread...");
                
                worker.postMessage({ type: 'init' });
                
                const handler = (e) => {
                    if (e.data.type === 'ready') {
                        worker.removeEventListener('message', handler);
                        logToUI("✅ Kokoro loaded successfully!");
                        status.textContent = "Worker Ready. Running Inference...";
                        resolve();
                    } else if (e.data.type === 'error') {
                        worker.removeEventListener('message', handler);
                        reject(new Error(e.data.message));
                    }
                };
                worker.addEventListener('message', handler);
            });
        }

        function generateAudio(text, voice) {
            return new Promise((resolve, reject) => {
                worker.postMessage({ type: 'generate', payload: { text, voice } });
                
                const handler = (e) => {
                    if (e.data.type === 'audio') {
                        worker.removeEventListener('message', handler);
                        resolve({ audio: e.data.audioData, sampling_rate: e.data.sampleRate });
                    } else if (e.data.type === 'error') {
                        worker.removeEventListener('message', handler);
                        reject(new Error(e.data.message));
                    }
                };
                worker.addEventListener('message', handler);
            });
        }

        class AudioStreamQueue {
            constructor(ctx) {
                this.ctx = ctx;
                this.nextStartTime = 0;
            }

            playChunk(audioData, sampleRate) {
                if (this.nextStartTime === 0 || this.nextStartTime < this.ctx.currentTime) {
                    this.nextStartTime = this.ctx.currentTime + 0.1; 
                }
                const buffer = this.ctx.createBuffer(1, audioData.length, sampleRate);
                buffer.getChannelData(0).set(audioData);
                const source = this.ctx.createBufferSource();
                source.buffer = buffer;
                source.connect(this.ctx.destination);
                source.start(this.nextStartTime);
                this.nextStartTime += buffer.duration;
            }
            
            reset() { this.nextStartTime = 0; }
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function runBenchmark() {
            const btn = document.getElementById("start-btn");
            const voiceSelect = document.getElementById("voice-select");
            btn.disabled = true;
            voiceSelect.disabled = true;
            document.getElementById("log-box").textContent = "";
            
            try {
                if (audioCtx.state === 'suspended') await audioCtx.resume();

                await initModel();
                
                const selectedVoice = voiceSelect.value;
                const audioQueue = new AudioStreamQueue(audioCtx);

                for (const sentence of testSentences) {
                    logToUI(`\n=== Testing: "${sentence.emotion}" ===`);
                    audioQueue.reset();
                    
                    logToUI(`🤖 NORMAL TEXT: "${sentence.normal}"`);
                    const outNormal = await generateAudio(sentence.normal, selectedVoice);
                    audioQueue.playChunk(outNormal.audio, outNormal.sampling_rate);
                    
                    const durationNormal = (outNormal.audio.length / outNormal.sampling_rate) * 1000;
                    await sleep(durationNormal + 800); 

                    audioQueue.reset();

                    logToUI(`🎭 NEW PROSODIC TEXT: "${sentence.humanized}"`);
                    const outHuman = await generateAudio(sentence.humanized, selectedVoice);
                    audioQueue.playChunk(outHuman.audio, outHuman.sampling_rate);
                    
                    const durationHuman = (outHuman.audio.length / outHuman.sampling_rate) * 1000;
                    await sleep(durationHuman + 1500); 
                }

                document.getElementById("status").textContent = "Kokoro Benchmark Complete!";
                logToUI("\nTest Complete!");
                
            } catch (error) {
                console.error(error);
                logToUI(`❌ Error: ${error.message}`);
                document.getElementById("status").textContent = "Error occurred.";
            }
            
            btn.disabled = false;
            voiceSelect.disabled = false;
        }

        document.getElementById("start-btn").addEventListener("click", runBenchmark);
    </script>
</body>
</html>
