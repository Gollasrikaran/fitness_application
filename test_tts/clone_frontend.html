<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Shot Voice Cloning</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 800px; margin: 0 auto; text-align: center; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #e63946; color: white; border: none; border-radius: 8px; margin: 10px; font-weight: bold; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #clone-btn { background: #457b9d; }
        textarea { width: 100%; padding: 10px; font-size: 16px; margin-top: 20px; height: 100px; border-radius: 8px; border: 1px solid #ccc; }
        .status { margin-top: 20px; font-size: 18px; font-weight: bold; color: #1d3557; }
        audio { margin-top: 20px; width: 100%; }
    </style>
</head>
<body>

    <h1>🎙️ XTTSv2 Zero-Shot Voice Cloning</h1>
    <p>Record just 5 seconds of your voice, type some text, and the AI will clone your exact voice perfectly.</p>
    
    <div>
        <button id="record-btn">🔴 Record 5-Second Voice Sample</button>
    </div>
    
    <div id="recording-status" class="status">Waiting for audio sample...</div>
    
    <textarea id="text-input" placeholder="Type what you want your clone to say here...">Wow, I cannot believe the AI just perfectly cloned my voice in five seconds!</textarea>
    
    <div>
        <button id="clone-btn" disabled>Generate Clone Audio</button>
    </div>
    
    <div id="clone-status" class="status"></div>
    <audio id="audio-player" controls></audio>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let speakerBlob = null;

        const recordBtn = document.getElementById("record-btn");
        const cloneBtn = document.getElementById("clone-btn");
        const statusBox = document.getElementById("recording-status");
        const cloneStatus = document.getElementById("clone-status");
        const audioPlayer = document.getElementById("audio-player");

        recordBtn.addEventListener("click", async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    // Combine chunks into a WAV-compatible WebM/Ogg blob
                    speakerBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    statusBox.textContent = "✅ Voice Sample Recorded Successfully! Ready to Clone.";
                    statusBox.style.color = "green";
                    cloneBtn.disabled = false;
                    
                    // Stop all microphone tracks to turn off the red light
                    stream.getTracks().forEach(track => track.stop());
                };

                // Start recording
                mediaRecorder.start();
                statusBox.textContent = "🎙️ RECORDING... Please speak for 5 seconds!";
                statusBox.style.color = "red";
                recordBtn.disabled = true;

                // Automatically stop after 5 seconds
                setTimeout(() => {
                    mediaRecorder.stop();
                    recordBtn.disabled = false;
                    recordBtn.textContent = "🔄 Re-record Voice Sample";
                }, 5000);

            } catch (err) {
                statusBox.textContent = "❌ Error: Could not access microphone.";
                console.error(err);
            }
        });

        cloneBtn.addEventListener("click", async () => {
            const text = document.getElementById("text-input").value;
            if (!speakerBlob || !text) return;

            cloneBtn.disabled = true;
            cloneStatus.textContent = "⚙️ Sending to Python Backend for Cloning... (This may take 10-30 seconds)";
            
            const formData = new FormData();
            formData.append("text", text);
            // Pretend it's a wav file so Python accepts it easily
            formData.append("speaker_wav", speakerBlob, "speaker.wav"); 

            try {
                // Send to the Google Colab GPU Backend!
                const response = await fetch("https://tough-wolves-dress.loca.lt/clone", {
                    method: "POST",
                    body: formData
                });

                if (response.ok) {
                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    audioPlayer.src = audioUrl;
                    audioPlayer.play();
                    cloneStatus.textContent = "✅ Cloning Complete!";
                } else {
                    cloneStatus.textContent = "❌ Backend Error during cloning.";
                }
            } catch (err) {
                cloneStatus.textContent = "❌ Error: Could not connect to Python backend (Is it running?)";
                console.error(err);
            }
            
            cloneBtn.disabled = false;
        });
    </script>
</body>
</html>
